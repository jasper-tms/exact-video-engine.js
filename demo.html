<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>exact-video-engine.js — demo</title>

<!-- Loaded exactly the way the real consumers (SportViewer, movim.ai) load it:
     mp4box.js first, so the MP4Box/DataStream globals exist, then the engine
     from a PINNED release tag. Never reference @main — jsDelivr caches branch
     refs for hours, so the page would change behavior at unpredictable times
     with no commit anywhere. -->
<script src="https://unpkg.com/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/jasper-tms/exact-video-engine.js@v2.5.1/exact-video-engine.js"></script>

<style>
  :root {
    --background: #12141a;
    --panel: #1b1f28;
    --line: #2c3240;
    --text: #e8eaf0;
    --muted: #949bab;
    --accent: #5aa9ff;
    --exact: #34c98b;
    --approximate: #e0a13a;
    /* Buffered/cached segments on the scrubber track — lighter than the track
       itself so they read as "already in memory", the way a video player shades
       its buffered range. */
    --cached: #5b6478;
    --hit: #34c98b;
    --miss: #e0a13a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 20px 48px;
    background: var(--background);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .subtitle { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }

  /* Drop target: the whole page accepts a drop. The dashed panel is only the
     hint shown before a clip is loaded — once one is, it gets out of the way and
     the drag feedback moves to the page outline below. */
  #dropzone {
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    transition: border-color 120ms, background 120ms;
  }
  #dropzone.dragover { border-color: var(--accent); background: #1a2333; }
  #dropzone p { margin: 0 0 16px; color: var(--muted); }
  body.loaded #dropzone { display: none; }

  /* Dragging over a page that already has a clip: nothing to point at, so the
     whole viewport becomes the target. */
  body.loaded.dragover::after {
    content: "Drop to replace";
    position: fixed;
    inset: 8px;
    border: 2px dashed var(--accent);
    border-radius: 12px;
    background: rgba(90, 169, 255, 0.06);
    color: var(--accent);
    font-size: 14px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 16px;
    pointer-events: none;
  }

  button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  /* Fixed square box, regardless of which icon a button holds, so the play
     button never resizes when it swaps between its play and pause icons (it
     used to, back when it was a "Play"/"Pause" text label). Each icon is
     inline SVG rather than a Unicode glyph: a font glyph is centered by its
     line box, not its ink, which left the previous ◀/▶ triangles and the
     play/pause label visibly off-center. These are authored with their
     bounding box centered in their 24x24 viewBox instead — equal empty
     margin on the left and right. The chevrons open to a 110-degree interior
     angle (rather than a right angle) as a deliberate style choice. */
  .icon-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
  }
  .icon-button .icon {
    width: 20px;
    height: 20px;
    display: block;
  }
  /* Both icons are always in the DOM (see the #play markup above); only one
     is shown at a time, so swapping between them never changes the box. */
  .icon-button .icon-pause {
    display: none;
  }
  #play.is-playing .icon-play {
    display: none;
  }
  #play.is-playing .icon-pause {
    display: block;
  }

  #player { display: none; }
  #player.loaded { display: block; }

  /* The engine sizes its canvas backing store to this pane, and letterboxes
     inside it. The <video> is styled to match with object-fit: contain. */
  #pane {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  #pane canvas, #pane video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* A paused seek whose frame has not been decoded and presented yet (and has
     taken more than a grace period — see WAITING_INDICATOR_DELAY_MILLISECONDS)
     dims the picture, so the stale pixels visibly read as "not the frame you
     asked for". The "Waiting for frame…" pill below the video appears in step
     with this. */
  #pane.waiting-for-frame canvas, #pane.waiting-for-frame video {
    filter: brightness(0.4);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  /* Tabular figures so the frame counter does not jitter as digits change. */
  .readout {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  .readout strong { color: var(--text); font-weight: 600; }
  /* Fully custom range so the track can be painted with the cache occupancy.
     Two stacked gradient layers live in --scrubber-track (set every tick from
     the engine's cache): the played fill on top, the cached segments beneath,
     over the flat --line base colour. Without appearance:none the browser draws
     its own track over these. */
  #scrubber {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    min-width: 160px;
    height: 16px;
    background: transparent;
    cursor: pointer;
  }
  #scrubber::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 3px;
    background-color: var(--line);
    background-image: var(--scrubber-track, none);
  }
  #scrubber::-moz-range-track {
    height: 6px;
    border-radius: 3px;
    background-color: var(--line);
    background-image: var(--scrubber-track, none);
  }
  /* Firefox fills the left of the track on its own; we paint the played fill
     into --scrubber-track ourselves, so silence its built-in one. */
  #scrubber::-moz-range-progress { background: transparent; }
  #scrubber::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    margin-top: -4px;   /* centre the 14px thumb on the 6px track */
    border-radius: 50%;
    background: var(--accent);
  }
  #scrubber::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
  }

  .diagnostics {
    display: flex;
    gap: 20px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  #seek-readout strong.hit { color: var(--hit); }
  #seek-readout strong.miss { color: var(--miss); }

  .headroom {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }
  .meter {
    flex: 1;
    min-width: 160px;
    max-width: 380px;
    height: 10px;
    border-radius: 5px;
    background: var(--line);
    overflow: hidden;
  }
  /* Width tracks the smoothed fullness; colour crosses from healthy green to
     amber to red as the buffer drains. Transitions keep both changes fluid at
     the tick rate rather than stepping. */
  .meter-fill {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    background: var(--exact);
    transition: width 140ms linear, background-color 240ms ease;
  }
  .meter-fill.low { background: var(--approximate); }
  .meter-fill.crit { background: #e05a5a; }

  .badges { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
  }
  .badge.exact { border-color: var(--exact); color: var(--exact); }
  .badge.approximate { border-color: var(--approximate); color: var(--approximate); }
  /* The engine badge is a button: click it to replay the clip through the other
     engine. Overrides the generic button rule's padding so it matches the pill
     next to it. */
  button.badge {
    padding: 4px 10px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  button.badge:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
  button.badge::after { content: " ⇄"; opacity: 0.6; }
  /* Nothing to toggle to when the container yields no sample table (WebM, or one
     we could not read at all): WebCodecs has nothing to decode from, so native is
     the only engine. Drop the swap arrow
     rather than advertise an action that does not exist — and keep the pill at
     full opacity (unlike the generic disabled button) since it is still saying
     something true and worth reading. */
  button.badge:disabled { opacity: 1; cursor: default; }
  button.badge:disabled::after { content: none; }

  /* Lit while the video is dimmed for a still-pending seek; accent-coloured so
     the eye lands on the explanation, not just the darkened picture. */
  #waiting-badge { border-color: var(--accent); color: var(--accent); }

  /* Names the clip directly above the frame it labels. */
  #clip-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
    min-width: 0;
  }
  #clip-name {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #clip-size {
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  #status { margin-top: 16px; font-size: 14px; color: var(--muted); min-height: 21px; }
  #status.error { color: #ff8080; }
</style>
</head>
<body>
<main>
  <h1>exact-video-engine.js</h1>
  <p class="subtitle">
    Frame-perfect playback. Drop a video below to see which engine it gets and
    whether its frame indices are exact.
  </p>

  <div id="dropzone">
    <p>Drop a video here</p>
    <button id="browse">Browse&hellip;</button>
    <input id="file-input" type="file" accept="video/*" hidden>
  </div>

  <div id="player">
    <div id="clip-header">
      <span id="clip-name"></span>
      <span id="clip-size"></span>
    </div>

    <div id="pane">
      <canvas id="engine-canvas"></canvas>
      <video id="native-video" muted playsinline></video>
    </div>

    <div class="controls">
      <button id="play" class="icon-button" title="Play/pause">
        <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M3.6 3.25L3.6 20.75L20.4 12Z"/></svg>
        <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
      </button>
      <button id="previous" class="icon-button" title="Previous frame">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.1 6L9.9 12L14.1 18"/></svg>
      </button>
      <button id="next" class="icon-button" title="Next frame">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 6L14.1 12L9.9 18"/></svg>
      </button>
      <span class="readout">
        frame <strong id="frame-readout">0</strong> / <span id="total-readout">0</span>
      </span>
      <input id="scrubber" type="range" min="0" max="0" step="1" value="0">
      <span class="readout">
        <strong id="time-readout">0:00.000</strong> / <span id="duration-readout">0:00.000</span>
      </span>
    </div>

    <!-- Live caching diagnostics. The scrubber track above is shaded where
         frames are resident in the engine's decode cache; this row names the
         result of the most recent seek: whether the target frame was already
         cached (so display was instant) and how long the seek took to land. -->
    <div class="diagnostics">
      <span class="readout" id="cache-readout" title="Frames currently held in the WebCodecs engine's decode cache (the shaded segments on the scrubber).">cache: <strong>—</strong></span>
      <span class="readout" id="seek-readout">last seek: <strong>—</strong></span>
    </div>

    <!-- Read-ahead headroom. How many seconds of video are decoded and resident
         CONTINUOUSLY ahead of the playhead (a gap ahead stalls playback at the
         gap, so only the unbroken run counts), against the seconds the engine
         intends to hold ahead. Full and green means the decoder is keeping well
         ahead; draining toward empty and red means it is falling behind and a
         stutter is near. Smoothed so it is readable during live playback. -->
    <div class="headroom">
      <span class="readout" id="headroom-label">read-ahead: <strong>—</strong></span>
      <div class="meter" title="Seconds of video decoded continuously ahead of the playhead, as a fraction of the engine's intended read-ahead window.">
        <div class="meter-fill" id="headroom-fill"></div>
      </div>
    </div>

    <div class="badges">
      <span class="badge" id="format-badge"></span>
      <button class="badge" id="engine-badge" type="button"
              title="Click to play this clip through the other engine"></button>
      <span class="badge" id="waiting-badge" hidden
            title="A seek was requested but the target frame has not been decoded and presented yet, so the picture still shows the previous frame — dimmed until the requested frame lands."
            >Waiting for frame&hellip;</span>
    </div>
  </div>

  <div id="status"></div>
</main>

<script>
const canvas = document.getElementById('engine-canvas');
const video = document.getElementById('native-video');
const dropzone = document.getElementById('dropzone');
const player = document.getElementById('player');
const status = document.getElementById('status');
const playButton = document.getElementById('play');
const scrubber = document.getElementById('scrubber');
const frameReadout = document.getElementById('frame-readout');
const totalReadout = document.getElementById('total-readout');
const timeReadout = document.getElementById('time-readout');
const durationReadout = document.getElementById('duration-readout');
const cacheReadout = document.getElementById('cache-readout');
const seekReadout = document.getElementById('seek-readout');
const headroomLabel = document.getElementById('headroom-label');
const headroomFill = document.getElementById('headroom-fill');

let engine = null;
let scrubbing = false;

// The waiting-for-frame indicator (dimmed picture + the pill under the video).
// A paused seek names its target instantly (engine.currentFrame) but the pixels
// arrive only when the frame is decoded (engine.presentedFrame); while those
// disagree the picture on screen is not the frame that was asked for. The grace
// period keeps an already-cached frame that lands within a tick or two from
// flashing the indicator, and scrubbing suppresses it — rapid-fire seeks
// mid-drag are expected to lag a little, and flagging every intermediate tick
// would be noise, not signal.
const WAITING_INDICATOR_DELAY_MILLISECONDS = 80;
let requestedFrame = null;   // last paused-seek target; null once playback runs
let waitingTimer = null;
let waitingShown = false;
const pane = document.getElementById('pane');
const waitingBadge = document.getElementById('waiting-badge');

function isSeekWaiting() {
  return !!engine && engine.paused && requestedFrame !== null
    && typeof engine.presentedFrame === 'number'
    && engine.presentedFrame !== requestedFrame;
}

function showWaitingIndicator(show) {
  if (waitingShown === show) return;
  waitingShown = show;
  pane.classList.toggle('waiting-for-frame', show);
  waitingBadge.hidden = !show;
}

// Called every tick: settles the indicator off immediately, but only turns it
// on once the seek has been waiting for the whole grace period.
function updateWaitingIndicator() {
  if (!isSeekWaiting() || scrubbing) {
    if (waitingTimer !== null) { clearTimeout(waitingTimer); waitingTimer = null; }
    showWaitingIndicator(false);
    return;
  }
  if (waitingShown || waitingTimer !== null) return;
  waitingTimer = setTimeout(() => {
    waitingTimer = null;
    if (isSeekWaiting() && !scrubbing) showWaitingIndicator(true);
  }, WAITING_INDICATOR_DELAY_MILLISECONDS);
}

// A seek in flight, timed from request to the moment its frame is on screen.
// `hit` is decided at request time — was the target already in the decode cache?
// A hit should paint on the very next tick (no decode), a miss waits on a
// decode. Null when no seek is being measured (idle, or playing).
let seekMeasure = null;

// Whether the WebCodecs decode cache is reachable on this engine. The native
// <video> fallback has no addressable frame cache (and no bitmapForFrame), so
// the cache strip and the hit/miss verdict only mean something on WebCodecs.
function hasFrameCache() {
  return !!engine && !engine.tier.startsWith('native') && !!engine._cache;
}

// Is display frame n resident in the cache right now (i.e. would seeking to it
// paint instantly)? bitmapForFrame is the public probe; a frame merely decoding
// (_pending) is deliberately NOT a hit, since its pixels have not landed yet.
function frameIsCached(n) {
  return hasFrameCache() && !!engine.bitmapForFrame(n);
}

// Every discrete seek routes through here so the indicator always knows the
// current target. Reading the target back from engine.currentFrame (which
// lands the instant a seek is requested) rather than storing the raw argument
// keeps an out-of-range request — stepping past either end of the clip — from
// recording a frame number that presentedFrame could never reach.
function seekToFrame(frame) {
  engine.seekToFrame(frame);
  requestedFrame = engine.currentFrame;
  // Start (or restart, if a previous seek had not yet landed) the stopwatch for
  // this target. The cache is probed BEFORE the decoder has a chance to react,
  // so the verdict reflects what was resident at the instant of the request.
  const target = engine.currentFrame;
  seekMeasure = {
    target,
    hit: frameIsCached(target),
    startedAt: performance.now(),
  };
  // A hit that is already the frame on screen (re-seeking the current frame)
  // would never flip presentedFrame, so settle it immediately.
  if (seekMeasure.hit && engine.presentedFrame === target) settleSeekMeasure();
}

function settleSeekMeasure() {
  if (!seekMeasure) return;
  const elapsed = performance.now() - seekMeasure.startedAt;
  const verdict = seekMeasure.hit ? 'CACHE HIT' : 'miss (decoded)';
  seekReadout.innerHTML = 'last seek: <strong class="'
    + (seekMeasure.hit ? 'hit' : 'miss') + '">→ frame ' + seekMeasure.target
    + ': ' + verdict + ' · ' + elapsed.toFixed(elapsed < 10 ? 1 : 0) + ' ms</strong>';
  seekMeasure = null;
}

// Called each tick. Lands the measurement once the target's pixels are on
// screen; playback supersedes a pending seek (the playhead has moved on), so
// drop it rather than wait for a frame that is no longer the target.
function updateSeekMeasure() {
  if (!seekMeasure) return;
  if (!engine || !engine.paused) { seekMeasure = null; return; }
  if (engine.presentedFrame === seekMeasure.target) { settleSeekMeasure(); return; }
  // A target that can never be reached (decode gave up, clip replaced) must not
  // leave the stopwatch running forever.
  if (performance.now() - seekMeasure.startedAt > 6000) {
    seekReadout.innerHTML = 'last seek: <strong class="miss">→ frame '
      + seekMeasure.target + ': did not land</strong>';
    seekMeasure = null;
  }
}

// The resident frame indices, collapsed into contiguous [start, end] ranges —
// what the scrubber shading and the cache readout both draw from.
function cachedRanges() {
  if (!hasFrameCache() || !engine._cache.size) return [];
  const keys = [...engine._cache.keys()].sort((a, b) => a - b);
  const ranges = [];
  let start = keys[0], prev = keys[0];
  for (let i = 1; i < keys.length; i++) {
    const k = keys[i];
    if (k === prev + 1) { prev = k; continue; }
    ranges.push([start, prev]);
    start = k; prev = k;
  }
  ranges.push([start, prev]);
  return ranges;
}

// Paint the scrubber track: the played fill on top, the cached segments beneath.
// Both are stacked linear-gradients handed to the track's background-image via a
// CSS variable; the flat track colour shows through the transparent gaps.
function updateCacheStrip() {
  if (!engine) { scrubber.style.removeProperty('--scrubber-track'); return; }
  const denom = Math.max(1, engine.numFrames - 1);
  const pct = (f) => Math.max(0, Math.min(100, (f / denom) * 100));

  // Only the cached segments are painted onto the track — no played/progress
  // fill. A fill covering everything left of the playhead would hide exactly the
  // cached frames behind it (a backward scrub's free frames), which are the point
  // of this strip. The thumb already marks the playhead position.
  const ranges = cachedRanges();
  let cachedFrames = 0;
  if (ranges.length) {
    const parts = [];
    let at = 0;
    for (const [s, e] of ranges) {
      cachedFrames += e - s + 1;
      // Widen each range a hair so a lone cached frame is still a visible sliver.
      let a = Math.max(at, pct(s) - 0.25);
      let b = Math.max(a, Math.min(100, pct(e) + 0.25));
      if (a > at) parts.push(`transparent ${at}% ${a}%`);
      parts.push(`var(--cached) ${a}% ${b}%`);
      at = b;
    }
    if (at < 100) parts.push(`transparent ${at}% 100%`);
    scrubber.style.setProperty('--scrubber-track',
      `linear-gradient(to right, ${parts.join(', ')})`);
  } else {
    scrubber.style.removeProperty('--scrubber-track');
  }

  if (!hasFrameCache()) {
    cacheReadout.innerHTML = 'cache: <strong>— (native engine)</strong>';
  } else {
    const summary = ranges.length
      ? ranges.map(([s, e]) => (s === e ? `${s}` : `${s}–${e}`)).join(', ')
      : 'empty';
    cacheReadout.innerHTML = `cache: <strong>${cachedFrames} frame`
      + `${cachedFrames === 1 ? '' : 's'}</strong> [${summary}]`;
  }
}

// Exponential moving averages of the read-ahead depth, so the meter reads
// smoothly during live playback instead of flickering as frames land and evict
// tick to tick. Null until the first sample; reset on load.
let headroomEmaSeconds = null;
let headroomEmaFullness = null;
const HEADROOM_SMOOTHING = 0.15;   // weight of the newest sample each tick

// The read-ahead headroom meter: seconds of video decoded CONTIGUOUSLY ahead of
// the playhead, over the seconds the engine intends to hold ahead (_windowAhead
// frames, in time). Only the unbroken run from the playhead counts — a gap ahead
// is where playback would stall regardless of frames cached beyond it.
function updateHeadroom() {
  const times = hasFrameCache() && engine._index && engine._index.presentationTimes;
  if (!times || engine.numFrames === 0) {
    headroomLabel.innerHTML = hasFrameCache()
      ? 'read-ahead: <strong>—</strong>'
      : 'read-ahead: <strong>— (native engine)</strong>';
    headroomFill.style.width = '0%';
    headroomFill.className = 'meter-fill';
    headroomEmaSeconds = headroomEmaFullness = null;
    return;
  }

  const total = engine.numFrames;
  const current = Math.max(0, Math.min(total - 1, engine.currentFrame));
  // Walk forward over the contiguous cached run starting at the current frame.
  let lastCached = current;
  while (lastCached + 1 < total && engine._cache.has(lastCached + 1)) lastCached++;
  const aheadSeconds = Math.max(0, times[lastCached] - engine.currentTime);

  // What the engine is trying to hold ahead, in time — capped by the end of the
  // clip so the meter reads full near the end (nothing more to buffer) rather
  // than empty. Falls back to a 2 s reference if the window is somehow unreadable.
  const windowAhead = engine._windowAhead || 56;
  const targetEndFrame = Math.min(total - 1, current + windowAhead);
  const targetSeconds = Math.max(0, times[targetEndFrame] - times[current]);
  const fullness = targetSeconds > 0.001
    ? Math.max(0, Math.min(1, aheadSeconds / targetSeconds))
    : 1;   // no room left to read ahead (end of clip): not a starvation

  headroomEmaSeconds = headroomEmaSeconds === null ? aheadSeconds
    : headroomEmaSeconds + HEADROOM_SMOOTHING * (aheadSeconds - headroomEmaSeconds);
  headroomEmaFullness = headroomEmaFullness === null ? fullness
    : headroomEmaFullness + HEADROOM_SMOOTHING * (fullness - headroomEmaFullness);

  const percent = Math.round(headroomEmaFullness * 100);
  headroomFill.style.width = `${percent}%`;
  headroomFill.className = 'meter-fill'
    + (headroomEmaFullness < 0.2 ? ' crit' : headroomEmaFullness < 0.5 ? ' low' : '');
  headroomLabel.innerHTML = `read-ahead: <strong>${headroomEmaSeconds.toFixed(2)} s`
    + `</strong> ahead / ${targetSeconds.toFixed(2)} s (${percent}%)`;
}

// ?engine=native forces the <video> fallback, ?engine=webcodecs forces WebCodecs.
// Without it the library picks, which on a modern desktop browser always means
// WebCodecs — so this, and the engine pill below the video, are the only ways to
// see the fallback tiers the library exists to provide. Either way the request is
// only a preference: a clip WebCodecs cannot play still falls back.
let prefer = new URLSearchParams(location.search).get('engine') || 'auto';
let currentFile = null;
// The index for the clip in the player, or null if mp4box could not read its
// container. Kept because it decides whether the WebCodecs engine is reachable
// at all — see showEngineBadge().
let currentIndex = null;

// Milliseconds, not the usual m:ss — a frame at 30 fps is 33 ms, so anything
// coarser would sit unchanged while the frame counter next to it advances.
function formatTime(seconds) {
  if (!(seconds >= 0)) seconds = 0;
  const minutes = Math.floor(seconds / 60);
  const rest = seconds - minutes * 60;
  return `${minutes}:${rest.toFixed(3).padStart(6, '0')}`;
}

function setStatus(message, isError) {
  status.textContent = message || '';
  status.classList.toggle('error', !!isError);
}

async function load(file) {
  currentFile = file;
  setStatus('Loading ' + file.name + '…');
  // Decoders are a limited browser resource, so hand back the previous engine's
  // before building another.
  if (engine) { engine.destroy(); engine = null; }
  // A seek target from the previous engine means nothing to the new one.
  requestedFrame = null;
  seekMeasure = null;
  seekReadout.innerHTML = 'last seek: <strong>—</strong>';
  cacheReadout.innerHTML = 'cache: <strong>—</strong>';
  headroomLabel.innerHTML = 'read-ahead: <strong>—</strong>';
  headroomFill.style.width = '0%';
  headroomFill.className = 'meter-fill';
  headroomEmaSeconds = headroomEmaFullness = null;
  scrubber.style.removeProperty('--scrubber-track');
  updateWaitingIndicator();

  // Build the container index here rather than letting createBestEngine do it,
  // so we can report whether this container could be read at all — the thing
  // that decides whether frame indices are exact or merely assumed. Passing the
  // result (index, or null for "tried and failed") keeps it from being built
  // twice. The time budget is ours to choose because we are the caller now:
  // ContainerIndex left to itself will read a WebM of any size for as long as it
  // takes, which is right for a script and wrong for a page with a user waiting.
  let containerIndex = null;
  try {
    containerIndex = await ContainerIndex.fromSource(file, { timeoutMilliseconds: 10000 });
  } catch (indexError) {
    containerIndex = null;
  }
  currentIndex = containerIndex;
  showFormatBadge(file, containerIndex);

  try {
    engine = await createBestEngine(file, { canvas, video, prefer, index: containerIndex });
  } catch (error) {
    // Nothing is playing now, so bring the drop panel back rather than leave a
    // dead player on screen.
    player.classList.remove('loaded');
    document.body.classList.remove('loaded');
    // A refusal arrives as an UnplayableClipError: the sentence the engine
    // composed, plus fields to branch on. This demo shows the sentence, because
    // it is written to be shown — but it branches on `reason` for the one case
    // where a host can offer something better than an apology. That split is the
    // point of the two halves: prose for the person, fields for the program.
    if (error.reason === 'codec-not-decodable') {
      setStatus(`Cannot play this ${error.codecName || 'clip'}: `
        + `${error.message}`, true);
      console.info('exact-video-engine demo: this clip indexed fine '
        + `(${error.numFrames} frames, ${error.containerFormat}) and only the codec `
        + 'is the problem, so a re-encode is the fix rather than a different file.',
        { codec: error.codec, nativeErrorMessage: error.nativeErrorMessage });
    } else {
      setStatus('Could not play this file: ' + error.message, true);
    }
    return;
  }

  // The engine plays into one of the two elements; show that one.
  for (const element of [canvas, video]) {
    element.style.display = (element === engine.displayElement) ? '' : 'none';
  }

  // Reveal the player BEFORE sizing the canvas to it. resizeCanvas() measures
  // the pane, and a hidden pane measures 0x0 — which is how a correctly decoded
  // frame ends up as a flat wash of its own average colour, stretched across the
  // pane from a 1x1 backing store.
  player.classList.add('loaded');
  // Retires the drop panel and hands drag feedback to the page outline; the drop
  // listeners are on the document, so dropping a replacement keeps working.
  document.body.classList.add('loaded');

  engine.loop = true;
  engine.resizeCanvas();

  scrubber.max = Math.max(0, engine.numFrames - 1);
  scrubber.value = 0;
  // The LAST INDEX, not the frame count. Frame indices are 0-based everywhere in
  // this library, so a 30-frame clip ends at frame 29 — and printing "29 / 30"
  // invites you to go looking for a frame 30 that does not exist.
  totalReadout.textContent = Math.max(0, engine.numFrames - 1);
  totalReadout.title = `${engine.numFrames} frames, numbered 0 to ${engine.numFrames - 1}`;
  durationReadout.textContent = formatTime(engine.duration);

  showEngineBadge();

  document.getElementById('clip-name').textContent = file.name;
  document.getElementById('clip-size').textContent =
    `${engine.videoWidth}×${engine.videoHeight}`;

  setStatus('');
  playButton.classList.remove('is-playing');
}

// Whether the container could be indexed. That is the fork in the road: the
// index is the real per-frame timestamp table, and a clip that cannot get one
// is refused outright ("index or refuse") rather than played with guessed frame
// numbers. MP4 is indexed by mp4box (from the moov, or the moof fragments for
// fragmented files), WebM by the engine's own cluster scan, and Ogg by its page
// scan — but only the MP4 index carries the sample table WebCodecs needs, so it
// is also the gate on the WebCodecs engine.
function showFormatBadge(file, containerIndex) {
  const dot = file.name.lastIndexOf('.');
  const extension = dot === -1 ? '?' : file.name.slice(dot).toLowerCase();
  const badge = document.getElementById('format-badge');
  // Spelling out the consequence, not just the verdict: "could not index" means
  // nothing to a reader who does not already know that the container is where
  // the per-frame timestamp table comes from.
  badge.textContent = `Format ${extension} → `
    + (containerIndex
      ? 'indexed → frame indices and times are exact'
      : 'could not index → refused (this engine reports only exact frame numbers)');
  badge.className = 'badge ' + (containerIndex ? 'exact' : 'approximate');
  badge.title = containerIndex
    ? `Read the real per-frame timestamp table out of this ${containerIndex.containerFormat}`
      + ' container, so frame indices are exact even on a variable-frame-rate clip.'
      + (containerIndex.supportsWebCodecs ? '' : ' This container carries no sample '
        + 'table for WebCodecs to decode from, so the <video> element plays it — '
        + 'with exact frame numbers all the same.')
    : 'Only MP4/MOV (mp4box), WebM/MKV, and Ogg can be indexed, and a full-file '
      + 'indexing pass has a time budget it may run out of. Rather than play with '
      + 'frame numbers from an assumed constant frame rate, the engine refuses the '
      + 'clip.';
}

// Names the engine actually in use — not the one requested, since a request is
// only a preference and a clip WebCodecs cannot play falls back regardless.
function showEngineBadge() {
  const badge = document.getElementById('engine-badge');
  const isNative = engine.tier.startsWith('native');
  badge.textContent = `Engine: ${isNative ? 'native' : 'webcodecs'}`;

  // Without an index that WebCodecs can decode from there is no other engine to
  // toggle to. WebCodecs is a decoder, not a demuxer: something has to hand it
  // the encoded chunks, which means a sample table — and only the MP4 index has
  // one (a WebM index is timestamps and nothing else). So for a WebM, and for
  // any container we could not index at all, the native element is the only
  // engine that can play the clip. Leaving the pill live would offer a switch
  // that silently lands back where it started.
  const canDecodeHere = !!(currentIndex && currentIndex.supportsWebCodecs);
  badge.disabled = !canDecodeHere;
  badge.title = !canDecodeHere
    ? engine.tier + ' — WebCodecs needs a demuxed sample table to decode from and '
      + 'this container has none to give, so the native element is the only engine '
      + 'available'
    : engine.tier + ' — click to play this clip through the other engine';
}

// The engine pill is a toggle: flip the preference and reload the same clip.
document.getElementById('engine-badge').addEventListener('click', () => {
  if (!engine || !currentFile) return;
  prefer = engine.tier.startsWith('native') ? 'webcodecs' : 'native';
  load(currentFile);
});

// One rAF loop for the life of the page. VideoEngine advances its playhead and
// paints inside update(); NativeVideoEngine's update() is a no-op (the element
// runs its own clock), so calling it unconditionally is safe and is the whole
// point of the two engines sharing a surface.
function tick(now) {
  if (engine && engine.ready) {
    engine.update(now);
    const frame = engine.currentFrame;
    frameReadout.textContent = frame;
    timeReadout.textContent = formatTime(engine.currentTime);
    if (!scrubbing) scrubber.value = frame;
    playButton.classList.toggle('is-playing', !engine.paused);
    // Playback supersedes any discrete seek: once the engine is playing, the
    // last requested frame is no longer a target the picture is chasing, and
    // keeping it would leave the waiting indicator stuck on after the next
    // pause (the playhead has moved past it, so presentedFrame can never
    // match it again).
    if (!engine.paused) requestedFrame = null;
    updateWaitingIndicator();
    updateSeekMeasure();
    updateCacheStrip();
    updateHeadroom();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

playButton.addEventListener('click', () => {
  if (!engine) return;
  engine.paused ? engine.play() : engine.pause();
});
document.getElementById('previous').addEventListener('click', () => {
  if (!engine) return;
  engine.pause();
  seekToFrame(engine.currentFrame - 1);
});
document.getElementById('next').addEventListener('click', () => {
  if (!engine) return;
  engine.pause();
  seekToFrame(engine.currentFrame + 1);
});
scrubber.addEventListener('pointerdown', () => { scrubbing = true; });
scrubber.addEventListener('pointerup', () => { scrubbing = false; });
scrubber.addEventListener('input', () => {
  if (!engine) return;
  engine.pause();
  seekToFrame(parseInt(scrubber.value, 10));
});

// Browse
const fileInput = document.getElementById('file-input');
document.getElementById('browse').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) load(fileInput.files[0]);
});

// Drag and drop, anywhere on the page, whether or not a clip is already loaded.
// dragover must be cancelled or the browser navigates away to the dropped file
// instead of handing it to us. The `dragover` class goes on both the panel and
// the body: only one of them is visible at a time (see the CSS), so this is one
// listener serving the empty and the loaded state.
function setDragging(dragging) {
  dropzone.classList.toggle('dragover', dragging);
  document.body.classList.toggle('dragover', dragging);
}
for (const type of ['dragenter', 'dragover']) {
  document.addEventListener(type, (event) => {
    event.preventDefault();
    setDragging(true);
  });
}
document.addEventListener('dragleave', (event) => {
  // relatedTarget is null only when the pointer leaves the window entirely;
  // without that check, crossing between elements would flicker the highlight.
  if (event.relatedTarget === null) setDragging(false);
});
document.addEventListener('drop', (event) => {
  event.preventDefault();
  setDragging(false);
  const file = event.dataTransfer.files[0];
  if (file) load(file);
});

window.addEventListener('resize', () => { if (engine) engine.resizeCanvas(); });
</script>
</body>
</html>
